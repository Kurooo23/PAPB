name: rivnet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.3
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  change_app_package_name: ^1.5.0
  google_sign_in: ^7.2.0
  get: ^4.7.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.00
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logos/clubs/
    - assets/images/logos/flags/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/rivnet_logo.png"
  adaptive_icon_background: "#001B4D"
  adaptive_icon_foreground: "assets/icons/rivnet_logo.png"